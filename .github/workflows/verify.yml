name: Verify test environment
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  page_build:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  configuration:
    name: Environment configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: node --test scripts/*.test.mjs
  deployed-site:
    name: Deployed preview
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    needs: configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: node scripts/verify-deployment.mjs
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: paste-perfect/paste-perfect
          ref: ${{ steps.deployment.outputs.sha }}
          path: source
          persist-credentials: false
      - run: npm ci --no-audit --fund=false
        working-directory: source
      - run: npx playwright install --with-deps chromium
        working-directory: source
      - name: Smoke-test the deployed source revision
        working-directory: source
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: https://paste-perfect.github.io/paste-perfect-test/
        run: npm run test:snapshots:local -- code-highlighter-smoke copy-settings-dialog-opens formatter-migrations --ignore-snapshots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && hashFiles('source/reports/playwright/**') != '' }}
        with:
          name: deployment-browser-report
          path: source/reports/playwright/
          retention-days: 7
